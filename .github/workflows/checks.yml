name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: process_log_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: process_log_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U process_log_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROCESS_LOG_TEST_DATABASE_URL: postgresql://process_log_test:test_only@localhost:5432/process_log_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build:editor
      - run: git diff --exit-code -- static/vendor/rich-editor.js static/vendor/rich-editor.LICENSE.txt static/vendor/mermaid-runtime.js static/vendor/mermaid-runtime.js.LEGAL.txt static/vendor/code-runtime.mjs
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:code-ui
      - run: npm run test:database-ui
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: Build exact checked-out application image
        run: docker build -t sanyulog:r2-check .
      - name: Verify private media modules in image without credentials
        run: docker run --rm sanyulog:r2-check python -c "import server, r2_media, r2_reconcile, database_blocks; from pathlib import Path; assert all(Path('static', name).is_file() for name in ('database-core.mjs', 'database-ui.mjs', 'database.css'))"
      - name: Record checked-out revision and built image ID
        run: |
          git rev-parse HEAD
          docker image inspect sanyulog:r2-check --format '{{.Id}}'
