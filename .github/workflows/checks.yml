name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: process_log_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: process_log_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U process_log_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROCESS_LOG_TEST_DATABASE_URL: postgresql://process_log_test:test_only@localhost:5432/process_log_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
