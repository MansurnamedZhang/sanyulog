<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254f42" />
    <meta
      name="description"
      content="本地 Notebook：用文字、代码、日志和图片持续记录实验与思考"
    />
    <title>三余记 · Sanyu Notes</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 64x64" />
    <link rel="icon" type="image/svg+xml" href="/brand/sanyu-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/login.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="notebook-app">
    <button
      class="nav-scrim"
      data-action="close-navigation"
      aria-label="关闭导航"
      tabindex="-1"
    ></button>
    <div class="workspace">
      <aside class="sidebar" id="workspace-navigation" aria-label="项目导航">
        <a class="brand" href="/" aria-label="三余记首页"
          ><img
            class="brand-mark"
            src="/brand/sanyu-mark.svg"
            width="44"
            height="44"
            alt=""
          /><span>三余记<small>SANYU NOTES</small></span></a
        >
        <div class="workspace-picker">
          <label for="workspace-select">工作空间</label
          ><select id="workspace-select" aria-label="切换工作空间"></select>
          <div>
            <button class="text-button" data-action="new-workspace">
              ＋ 新建空间</button
            ><button class="text-button" data-action="workspace-settings">
              设置
            </button>
          </div>
        </div>
        <div class="side-section">
          <span class="eyebrow">项目</span
          ><button
            class="icon-button"
            data-action="new-project"
            title="新建项目"
            aria-label="新建项目"
          >
            ＋
          </button>
        </div>
        <nav id="projects"></nav>
        <div class="side-bottom">
          <div class="account-name" data-auth-control hidden>
            当前账号：<strong data-account-name></strong>
          </div>
          <button
            class="side-tool"
            data-admin-control
            data-action="manage-accounts"
            hidden
          >
            账号管理
          </button>
          <button class="side-tool" data-action="templates">
            <span>▧</span> 记录模板
          </button>
          <button class="side-tool" data-action="backup">
            <span>↓</span> 当前账号备份
          </button>
          <button class="side-tool" data-action="restore">
            <span>↥</span> 恢复当前账号
          </button>
          <button
            class="side-tool"
            data-auth-control
            data-action="change-password"
            hidden
          >
            修改密码</button
          ><button
            class="side-tool"
            data-auth-control
            data-action="logout"
            hidden
          >
            退出登录
          </button>
          <div class="local-note">
            <span class="dot"></span> 三余记<small>记下过程，沉淀思考</small>
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button
            class="button small portrait-control"
            data-action="navigation"
            aria-label="展开或收起工作空间导航"
            aria-controls="workspace-navigation"
            aria-expanded="false"
          >
            ☰ 工作空间</button
          ><button
            class="button small portrait-control back-list"
            data-action="back-list"
          >
            ← 返回列表
          </button>
          <div class="breadcrumb">
            <span id="workspace-label">默认工作空间</span><span>/</span
            ><strong id="project-label">全部记录</strong>
          </div>
          <div class="topbar-actions">
            <details class="view-menu" data-view-menu>
              <summary aria-label="视图设置">视图</summary>
              <div class="view-menu-panel">
                <div class="view-section">
                  <strong>列表密度</strong>
                  <div class="view-options">
                    <label
                      ><input
                        type="radio"
                        name="view-density"
                        data-view="density"
                        value="comfortable"
                      />舒适</label
                    >
                    <label
                      ><input
                        type="radio"
                        name="view-density"
                        data-view="density"
                        value="compact"
                      />紧凑</label
                    >
                  </div>
                </div>
                <div class="view-section">
                  <strong>阅读字号</strong>
                  <div class="view-options">
                    <label
                      ><input
                        type="radio"
                        name="view-text"
                        data-view="textSize"
                        value="small"
                      />小</label
                    >
                    <label
                      ><input
                        type="radio"
                        name="view-text"
                        data-view="textSize"
                        value="normal"
                      />标准</label
                    >
                    <label
                      ><input
                        type="radio"
                        name="view-text"
                        data-view="textSize"
                        value="large"
                      />大</label
                    >
                  </div>
                </div>
                <p>仅在此浏览器记忆，不影响导出。</p>
              </div>
            </details>
            <span id="today" class="today"></span
            ><button
              class="button small focus-control"
              data-action="focus-mode"
              aria-pressed="false"
            >
              专注模式
            </button>
          </div>
        </header>
        <section class="workbench">
          <aside class="record-pane" aria-label="记录列表">
            <section class="page-heading">
              <div>
                <span class="eyebrow">笔记库</span>
                <h1 id="page-title">全部记录</h1>
                <p id="page-description">
                  用文字、代码和图片，接着记录每一次探索。
                </p>
              </div>
              <div class="heading-actions">
                <button
                  id="project-settings"
                  class="button subtle"
                  data-action="project-settings"
                  hidden
                >
                  项目设置</button
                ><button class="button primary" data-action="new-record">
                  ＋ 新建笔记本
                </button>
              </div>
            </section>
            <div class="search-wrap">
              <span aria-hidden="true">⌕</span
              ><input
                id="search"
                type="search"
                placeholder="搜索笔记、内容或标签"
                aria-label="搜索记录"
              /><button
                class="search-shortcut"
                data-action="search-focus"
                title="搜索笔记（Ctrl+K）"
                aria-label="搜索笔记（Ctrl+K）"
              >
                Ctrl K
              </button>
            </div>
            <div class="filter-row">
              <select id="status-filter" aria-label="按状态筛选">
                <option value="">全部状态</option>
                <option>进行中</option>
                <option>已完成</option>
                <option>受阻</option>
                <option>已搁置</option></select
              ><select id="tag-filter" aria-label="按标签筛选">
                <option value="">全部标签</option>
              </select>
            </div>
            <div class="list-caption">
              <span>笔记本</span
              ><span id="record-count" role="status" aria-live="polite"
                >0 条</span
              >
            </div>
            <div id="records" class="record-list">
              <p class="muted padded">正在读取记录…</p>
            </div>
          </aside>
          <section id="detail" class="detail" aria-label="记录详情">
            <div class="empty">
              <div class="empty-glyph">↗</div>
              <h2>正在打开工作空间</h2>
              <p>读取本地记录中…</p>
            </div>
          </section>
        </section>
      </main>
    </div>
    <dialog id="modal">
      <div class="modal-heading">
        <h2 id="modal-title"></h2>
        <button
          class="icon-button"
          data-action="close-modal"
          aria-label="关闭对话框"
        >
          ×
        </button>
      </div>
      <div id="modal-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <input id="attachment-picker" type="file" multiple hidden />
    <input
      id="restore-picker"
      type="file"
      accept=".zip,.plbackup,application/zip,application/octet-stream"
      hidden
    />
  </body>
</html>
