<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254f42" />
    <meta name="description" content="三余记：记下过程，沉淀思考。" />
    <title>登录 · 三余记</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 64x64" />
    <link rel="icon" type="image/svg+xml" href="/brand/sanyu-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/login.css" />
    <script type="module" src="/auth-ui.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="auth-brand">
        <img
          class="auth-logo"
          src="/brand/sanyu-mark.svg"
          width="64"
          height="64"
          alt=""
        />
        <div>
          <p class="auth-eyebrow">SANYU NOTES</p>
          <h1>三余记</h1>
        </div>
      </div>
      <p class="auth-description">
        记下过程，沉淀思考。<br />登录，继续每一次探索。
      </p>
      <form id="login-form">
        <label
          >账号<input
            name="username"
            autocomplete="username"
            maxlength="64"
            required
            autofocus /></label
        ><label
          >密码<input
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
        /></label>
        <p class="auth-error" role="alert"></p>
        <button type="submit">登录</button>
        <p class="auth-hint" data-session-hint>此设备 7 天内免重复登录</p>
      </form>
    </main>
  </body>
</html>
