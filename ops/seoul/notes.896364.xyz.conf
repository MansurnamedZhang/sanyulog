# Staging default: maintenance only. Never replace any other site's config.
# Bootstrap only the first server block before the named certificate exists.
# After certonly --webroot succeeds, validate/install this complete template.
server {
    listen 80;
    server_name notes.896364.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/notes.896364.xyz-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三余记维护中</title><h1>三余记维护中</h1><p>数据核验完成后开放，请稍后再试。</p></html>';
    }
}

server {
    listen 443 ssl;
    server_name notes.896364.xyz;
    ssl_certificate /etc/letsencrypt/live/notes.896364.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.896364.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三余记维护中</title><h1>三余记维护中</h1><p>数据核验完成后开放，请稍后再试。</p></html>';
    }
}

