# Sanyu Seoul cutover: this site only. Keep the ACME webroot for renewal.
server {
    listen 80;
    server_name notes.896364.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/notes.896364.xyz-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://notes.896364.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name notes.896364.xyz;
    ssl_certificate /etc/letsencrypt/live/notes.896364.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.896364.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
